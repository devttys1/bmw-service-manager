[project]
name = "bmw-service-manager"
version = "0.1.0"
description = "Write (and probe for a way to read) BMW head-unit service history over ENET"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["flask>=3.0", "ifaddr>=0.2", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["pytest-playwright>=0.5"]

[project.scripts]
bmw-service-manager = "bmw_service_manager.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bmw_service_manager"]

[tool.setuptools.package-data]
bmw_service_manager = ["static/*", "static/replay/*", "static/vendor/*"]
